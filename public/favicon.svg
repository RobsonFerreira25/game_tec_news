<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0c"/>
  
  <!-- Outer glow -->
  <rect width="64" height="64" rx="12" fill="url(#glow)" opacity="0.3"/>
  
  <!-- G letter shape with neon effect -->
  <path d="M 32 14 L 50 14 L 50 20 L 38 20 L 38 28 L 48 28 L 48 34 L 38 34 L 38 44 L 50 44 L 50 50 L 32 50 L 32 44 L 26 44 L 26 34 L 32 34 L 32 28 L 20 28 L 20 20 L 32 20 Z" 
        fill="url(#gradient)" 
        stroke="url(#gradient)" 
        stroke-width="1"/>
  
  <!-- Accent line -->
  <line x1="14" y1="32" x2="22" y2="32" stroke="#00f2ff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Defs -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7000ff;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#7000ff;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>
